name: Build Just Player DV APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unit tests (Dolby Vision profile 7 to 8.1 conversion)
        run: ./gradlew --no-daemon :app:testLatestUniversalDebugUnitTest

      # The signing key is kept in the Actions cache, so every build has the same signature and
      # can be installed over the previous one. If the cache expires (7 days without builds) a new
      # key is created and the app has to be uninstalled once before installing the new build.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.dv-signing/test-signing.keystore
          key: dv-test-signing-key-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.dv-signing
          if [ ! -f ~/.dv-signing/test-signing.keystore ]; then
            echo "::warning::New signing key: uninstall the previous build before installing this one."
            keytool -genkeypair -keystore ~/.dv-signing/test-signing.keystore -storetype PKCS12 \
              -alias justplayerdv -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass justplayerdv -keypass justplayerdv -dname "CN=Just Player DV test build"
          fi

      - name: Build release APK
        run: >
          ./gradlew --no-daemon :app:assembleLatestUniversalRelease
          -Pandroid.injected.signing.store.file="$HOME/.dv-signing/test-signing.keystore"
          -Pandroid.injected.signing.store.password=justplayerdv
          -Pandroid.injected.signing.key.alias=justplayerdv
          -Pandroid.injected.signing.key.password=justplayerdv

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/latestUniversal/release/*.apk "dist/JustPlayerDV-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JustPlayerDV-build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # Only builds of main go to the Releases page: every branch has its own Actions cache, hence
      # its own signing key, and mixing them would require uninstalling the app.
      - name: Publish the APK on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Just Player DV - build ${{ github.run_number }}
          make_latest: true
          body: |
            Build automatica dal ramo `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Per installarla sul tablet: scarica il file `JustPlayerDV-build-${{ github.run_number }}.apk` qui sotto e aprilo.
          files: dist/*.apk

      # Keep only the newest build on the Releases page, so the right APK is always the only one.
      - name: Remove older releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep -vx "build-${{ github.run_number }}" |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
